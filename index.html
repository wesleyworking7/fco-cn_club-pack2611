  const filter = document.getElementById('q').value.trim();
  renderList(filter);
  const ovrs = pk.players.map(x => x.ovr);
  headEl.innerHTML =
    '<div class="pack-title">' + pk.team + ' · ' + pk.strength + '绑定球员包</div>' +
    '<div class="pack-desc">' + pk.desc + '</div>' +
    '<div class="meta">' +
      '<div>球员数<b>' + pk.players.length + '</b></div>' +
      '<div>最高8强OVR<b>' + (Math.max.apply(null, ovrs) + 15) + '</b></div>' +
      '<div>最低8强OVR<b>' + (Math.min.apply(null, ovrs) + 15) + '</b></div>' +
    '</div>';

  let rows = pk.players.map(x => Object.assign({}, x));
  if (filter) {
    rows = DATA.flatMap(p => p.players.filter(x => x.name.includes(filter))
      .map(x => Object.assign({}, x, { _pk: p.team + ' ' + p.strength })));
  }
  let html = '<thead><tr><th class="num">#</th><th>球员</th><th class="num">8强OVR</th>' +
             (filter ? '<th>所属球员包</th>' : '') + '</tr></thead><tbody>';
  rows.forEach((x, i) => {
    html += '<tr>' +
      '<td class="num rank">' + (i + 1) + '</td>' +
      '<td><b>' + x.name + '</b></td>' +
      '<td class="num"><span class="ovr" style="background:' + ovrColor(x.ovr + 15) + '">' + (x.ovr + 15) + '</span></td>' +
      (filter ? '<td>' + x._pk + '</td>' : '') +
    '</tr>';
  });
  tblEl.innerHTML = html + '</tbody>';
  footEl.textContent = filter
    ? '搜索“' + filter + '”命中 ' + rows.length + ' 条球员记录（全部球员包）'
    : '共 ' + pk.players.length + ' 名球员 · OVR 为 8强能力值';
}

document.getElementById('q').addEventListener('input', render);
render();
</script>
</body>
</html>
